<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Journey — RGV Tours</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:        #0a0e1a;
      --navy-mid:    #0d1528;
      --navy-light:  #121d38;
      --blue:        #1a3a7a;
      --blue-bright: #2251b8;
      --red:         #c0392b;
      --red-bright:  #e74c3c;
      --gold:        #f39c12;
      --white:       #ffffff;
      --glass-bg:    rgba(13, 21, 40, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shine: rgba(255, 255, 255, 0.04);
      --text:        #e8edf5;
      --text-muted:  #7a8ba8;
      --text-dim:    #3d4f6b;
      --shadow:      rgba(0, 0, 0, 0.5);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ===== BACKGROUND ===== */
    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
    }

    .bg-gradient {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(26, 58, 122, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(192, 57, 43, 0.2) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, rgba(18, 29, 56, 0.8) 0%, transparent 70%);
    }

    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .bg-line {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(192,57,43,0.4), transparent);
      animation: scan 8s ease-in-out infinite;
    }
    .bg-line:nth-child(1) { top: 20%; width: 100%; animation-delay: 0s; }
    .bg-line:nth-child(2) { top: 60%; width: 100%; animation-delay: 4s; }

    @keyframes scan {
      0%, 100% { opacity: 0; transform: scaleX(0); }
      50% { opacity: 1; transform: scaleX(1); }
    }

    /* ===== CHAT CONTAINER ===== */
    .chat-container {
      position: relative; z-index: 1;
      width: 470px; height: 690px;
      display: flex; flex-direction: column;
      border-radius: 24px;
      overflow: hidden;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 32px 80px rgba(0,0,0,0.7),
        0 0 80px rgba(26,58,122,0.2),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* ===== HEADER ===== */
    .chat-header {
      position: relative;
      padding: 20px 20px 16px;
      background: linear-gradient(135deg, rgba(26,58,122,0.7) 0%, rgba(10,14,26,0.5) 100%);
      border-bottom: 1px solid var(--glass-border);
      overflow: hidden;
      flex-shrink: 0;
    }

    .header-accent {
      position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--red-bright), var(--gold), var(--red-bright), transparent);
    }

    .header-glow {
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 80px;
      background: radial-gradient(ellipse, rgba(34,81,184,0.3) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-content {
      position: relative; z-index: 2;
      display: flex; align-items: center; gap: 14px;
    }

    .avatar-wrap { position: relative; flex-shrink: 0; }

    .avatar {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-bright) 100%);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(192,57,43,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .online-ring {
      position: absolute; top: -2px; right: -2px;
      width: 14px; height: 14px;
      background: #27ae60;
      border: 2px solid var(--navy);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(39,174,96,0.7);
      animation: pulse-green 2s ease-in-out infinite;
    }

    @keyframes pulse-green {
      0%,100% { box-shadow: 0 0 8px rgba(39,174,96,0.7); }
      50%      { box-shadow: 0 0 16px rgba(39,174,96,1); }
    }

    .header-info { flex: 1; }

    .header-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px; font-weight: 900;
      color: var(--white);
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1;
    }

    .header-brand {
      font-size: 11px; font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-tagline {
      font-size: 10px; font-weight: 600;
      color: var(--gold);
      letter-spacing: 1px;
      margin-top: 4px;
      font-style: italic;
    }

    .live-badge {
      display: flex; align-items: center; gap: 5px;
      background: rgba(192,57,43,0.15);
      border: 1px solid rgba(192,57,43,0.3);
      border-radius: 20px;
      padding: 4px 10px;
    }

    .live-dot {
      width: 6px; height: 6px;
      background: var(--red-bright);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--red-bright);
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .live-text {
      font-size: 10px; font-weight: 700;
      color: var(--red-bright);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ===== CHAT BODY ===== */
    .chat-body {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex; flex-direction: column;
      gap: 12px;
    }

    .chat-body::-webkit-scrollbar { width: 3px; }
    .chat-body::-webkit-scrollbar-track { background: transparent; }
    .chat-body::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1); border-radius: 2px;
    }

    /* ===== MESSAGES ===== */
    .bot-message, .user-message {
      max-width: 87%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line;
      animation: msgIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      font-weight: 500;
    }

    @keyframes msgIn {
      from { opacity:0; transform: translateY(14px) scale(0.95); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    .bot-message {
      align-self: flex-start;
      background: rgba(26, 58, 122, 0.3);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 4px 16px 16px 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .user-message {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-bright) 100%);
      color: white;
      border-radius: 16px 4px 16px 16px;
      box-shadow: 0 4px 16px rgba(192,57,43,0.35);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .bot-message a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(243,156,18,0.4);
      transition: color 0.2s;
    }
    .bot-message a:hover { color: #f9ca48; }

    /* ===== TYPING ===== */
    .typing-indicator {
      align-self: flex-start;
      display: flex; align-items: center; gap: 5px;
      padding: 14px 18px;
      background: rgba(26,58,122,0.25);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 4px 16px 16px 16px;
      backdrop-filter: blur(8px);
    }

    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(1) { background: var(--blue-bright); animation-delay: 0s; }
    .typing-dot:nth-child(2) { background: var(--red-bright); animation-delay: 0.16s; }
    .typing-dot:nth-child(3) { background: var(--gold); animation-delay: 0.32s; }

    @keyframes bounce {
      0%,80%,100% { transform: scale(0.7); opacity:0.4; }
      40%          { transform: scale(1.2); opacity:1; }
    }

    /* ===== INPUT ===== */
    .chat-input {
      padding: 14px 16px 18px;
      background: rgba(10,14,26,0.6);
      border-top: 1px solid var(--glass-border);
      display: flex; gap: 10px; align-items: center;
      flex-shrink: 0;
      backdrop-filter: blur(8px);
    }

    .chat-input input {
      flex: 1;
      padding: 12px 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 14px; font-weight: 500;
      outline: none;
      transition: all 0.25s;
    }

    .chat-input input:focus {
      border-color: rgba(34,81,184,0.5);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(34,81,184,0.12);
    }

    .chat-input input::placeholder { color: var(--text-dim); }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-bright) 100%);
      color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s;
      box-shadow: 0 4px 14px rgba(192,57,43,0.4);
      flex-shrink: 0;
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(192,57,43,0.5);
    }
    .send-btn:active { transform: translateY(0); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 18px; height: 18px; fill: white; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: rgba(13,21,40,0.95);
      border: 1px solid var(--glass-border);
      color: var(--text); padding: 10px 22px;
      border-radius: 30px; font-size: 13px; font-weight: 600;
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      backdrop-filter: blur(16px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { color: var(--red-bright); border-color: rgba(231,76,60,0.3); }

    /* ===== MOBILE ===== */
    @media (max-width: 520px) {
      body {
        padding: 0;
        align-items: flex-start;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .chat-container {
        width: 100vw;
        height: auto;
        min-height: unset;
        border-radius: 0;
        box-shadow: none;
        border: none;
      }
      .chat-header {
        padding: 10px 16px 10px;
        padding-top: max(10px, env(safe-area-inset-top));
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .header-name { font-size: 20px; }
      .header-brand { font-size: 10px; }
      .header-tagline { font-size: 9px; margin-top: 2px; }
      .avatar { width: 40px; height: 40px; font-size: 18px; }
      .chat-body {
        flex: 1;
        min-height: 300px;
        max-height: none;
        overflow-y: visible;
      }
      .chat-input {
        padding: 10px 14px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        position: sticky;
        bottom: 0;
        z-index: 10;
      }
      .chat-input input { font-size: 16px; padding: 10px 14px; }
      .send-btn { width: 40px; height: 40px; }
      .bg-line { display: none; }
    }

    @media (min-width: 521px) {
      .chat-body { overflow-y: auto; }
    }
  </style>
</head>
<body>

<div class="bg">
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>
  <div class="bg-line"></div>
  <div class="bg-line"></div>
</div>

<div class="toast" id="toast"></div>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-glow"></div>
    <div class="header-content">
      <div class="avatar-wrap">
        <div class="avatar"></div>
        <div class="online-ring"></div>
      </div>
      <div class="header-info">
        <div class="header-name">Journey</div>
        <div class="header-brand">RGV Tours</div>
        <div class="header-tagline">Relax... We Know The Road!</div>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        <span class="live-text">Live</span>
      </div>
    </div>
    <div class="header-accent"></div>
  </div>

  <div class="chat-body" id="chat-body"></div>

  <div class="chat-input">
    <input type="text" id="user-input" placeholder="Ask about tours, packages, pricing..." autocomplete="off"/>
    <button class="send-btn" id="send-button" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script type="module">
  // ===== CONFIG =====
  const BACKEND_URL = "https://hsrpibsdfzzzvfmfakqu.supabase.co/functions/v1/journey-rgvtours-proxy";
  const CHATBOT_ID  = "journey-rgvtours";
  const ANON_KEY    = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzcnBpYnNkZnp6enZmbWZha3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc3NjU5MTIsImV4cCI6MjA2MzM0MTkxMn0.Sod7ubiP1Er_C1y6KfAuAJ79XatNErRLsdev7cLpXwk";
  const HEADERS     = {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${ANON_KEY}`,
    'apikey': ANON_KEY
  };

  // ===== STATE =====
  let sessionId = crypto.randomUUID();
  let conversationHistory = [];

  // ===== UTILS =====
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => { t.className = `toast ${type}`; }, 3000);
  }

  function addMessage(content, type) {
    const body = document.getElementById('chat-body');
    const div  = document.createElement('div');
    div.className = type;

    if (type === 'bot-message') {
      const processed = content
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/(https?:\/\/[^\s<]+)(?![^<]*<\/a>)/g, '<a href="$1" target="_blank">$1</a>');
      div.innerHTML = processed;
    } else {
      div.textContent = content;
    }

    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
  }

  function showTyping() {
    const body = document.getElementById('chat-body');
    const div  = document.createElement('div');
    div.className = 'typing-indicator';
    div.id = 'typing';
    div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
  }

  function removeTyping() { document.getElementById('typing')?.remove(); }

  // ===== SEND MESSAGE =====
  async function sendMessage() {
    const input   = document.getElementById('user-input');
    const btn     = document.getElementById('send-button');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    btn.disabled = true;

    addMessage(message, 'user-message');
    conversationHistory.push({ role: 'user', content: message });
    showTyping();

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: HEADERS,
        body: JSON.stringify({
          action: 'send_message',
          message: message,
          conversation_history: conversationHistory.slice(-10)
        })
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Request failed');
      }

      const data  = await res.json();
      const reply = data.data.message;

      addMessage(reply, 'bot-message');
      conversationHistory.push({ role: 'assistant', content: reply });

      fetch(BACKEND_URL, {
        method: 'POST',
        headers: HEADERS,
        body: JSON.stringify({
          action: 'save_chat',
          chatbot_id: CHATBOT_ID,
          message: message,
          response: reply,
          session_id: sessionId
        })
      }).catch(() => {});

    } catch (err) {
      removeTyping();
      console.error(err);
      addMessage(
        "I'm having trouble connecting right now. Please try again in a moment, or call us directly at (888) 748-8687 — we're here Monday–Friday 8AM–5PM! 🚌",
        'bot-message'
      );
      showToast('Connection error', 'error');
    }

    btn.disabled = false;
    input.focus();
  }

  // ===== INIT =====
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      addMessage(
        "Hey there! I'm Journey 🚌\nYour virtual travel guide for RGV Tours.\n\nRelax... We Know The Road! 🏈✨\n\nI can help you with:\n• Dallas Cowboys 2026 game tours\n• Disney World Summer 2026\n• Packages, pricing & payment options\n• Booking information\n\nWhat trip are you dreaming of?\n\n¡También hablo español!",
        'bot-message'
      );
    }, 500);

    const input = document.getElementById('user-input');
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });
    input.focus();
  });

  window.sendMessage = sendMessage;
</script>
</body>
</html>
